<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace de Coniques</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- JSXGraph -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    
    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    
    <!-- MathLive -->
    <script src="https://unpkg.com/mathlive"></script>
    
    <!-- MathJax -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Coniques</p>
                <h1>Trace de courbes</h1>
            </div>
            <a class="help-link" href="guide.html">Aide / explication</a>
        </header>

        <main class="container">
            <section class="panel-left">
                <div class="card input-section">
                    <h2>Equation</h2>
                    <p>Entre une equation parmi les formes prises en charge.</p>
                    <math-field id="math-input" math-virtual-keyboard-policy="manual">x^2 + y^2 = 4</math-field>
                    <p class="hint">Exemples: cercle, parabole, ellipse, hyperbole, ou forme generale a reduire.</p>
                </div>

                <div class="card analysis-section">
                    <h2>Analyse mathematique</h2>
                    <div id="conic-type"><strong>Type :</strong> <span>Cercle</span></div>
                    <div id="conic-properties"></div>
                </div>
            </section>

            <section class="panel-right">
                <div class="graph-stack">
                    <div id="jxgbox" class="jxgbox"></div>
                    <section class="card graph-controls" aria-label="Commandes du graphe">
                        <h2>Commandes du graphe</h2>
                        <div class="control-grid">
                            <button type="button" class="control-btn" data-action="zoom-in">Zoom avant</button>
                            <button type="button" class="control-btn" data-action="zoom-out">Zoom arriere</button>
                            <button type="button" class="control-btn" data-action="reset-view">Recentrer</button>
                            <button type="button" class="control-btn" data-action="clear-graph">Effacer</button>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <!-- JS -->
    <script src="js/parser.js"></script>
    <script src="js/conics.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
