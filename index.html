<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coniques</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #22201c; /* Solid dark background */
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .phrase-container {
            text-align: center;
            padding: 2rem;
            max-width: 900px;
        }
        .phrase {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 400;
            color: #d1cbc2; /* Light, slightly warm grey */
            line-height: 1.35;
            letter-spacing: -0.01em;
            text-transform: uppercase; /* More masculine, structured */
        }
        .phrase strong {
            font-weight: 700;
            color: #ffffff; /* Stark white emphasis */
        }
        .enter-btn {
            display: inline-block;
            margin-top: 3rem;
            padding: 0.85rem 2rem;
            font-size: 0.95rem;
            background: #8b5e34; /* Solid accent color */
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.15em; /* Wide spacing */
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 4px; /* Sharper edges */
            transition: background 0.2s ease, transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .enter-btn:hover {
            background: #a37345;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .phrase-container {
                padding: 1.5rem;
            }
            .phrase {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
                line-height: 1.4;
            }
            .enter-btn {
                margin-top: 2rem;
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <div class="phrase-container">
        <div class="phrase">
            Plateforme interactive conçue pour l'étude, l'analyse et le tracé de toutes les équations de <strong>coniques</strong>.
        </div>
        <a href="grap.html" class="enter-btn">Ouvrir</a>
    </div>
    <div class="creators" style="position: absolute; bottom: 20px; color: #888; font-size: 0.9rem; text-align: center; width: 100%;">
        Créé par <strong>TEVOEDJRE Jefferson</strong> et <strong>HOUNSONLON Sèwèdo</strong>
    </div>
</body>
</html>
